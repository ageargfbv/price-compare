<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>最安くらべ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#55b834">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="最安くらべ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@font-face{font-family:"Dela Gothic One";src:url(dela.woff2) format("woff2");font-display:swap}
:root{--bg:#f2f9e6;--card:#fff;--card2:#eef6df;--fg:#1d2b12;--sub:#6a7a58;--acc:#4aa52e;--acc2:#8bd44a;--gd:#2f7d1e;--soft:#e2f5bd;--line:#dfeccb;--good:#2f8f3e;--bad:#d64545;--warn:#b7791f;--shadow:0 5px 0 var(--line),0 8px 18px rgba(50,90,20,.14);--tab:66px}
@media (prefers-color-scheme:dark){:root{--bg:#11190d;--card:#1b2615;--card2:#243020;--fg:#eef5e6;--sub:#a3b394;--acc:#6cc24a;--acc2:#4aa52e;--gd:#9be36f;--soft:#26401b;--line:#2c3a24;--good:#6cc24a;--bad:#ff8a8a;--warn:#ecc94b;--shadow:0 5px 0 #0a1007,0 8px 18px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*{touch-action:manipulation}   /* ダブルタップで拡大しない（スクロールと、ふつうのタップは今までどおり） */
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 24px);-webkit-text-size-adjust:100%}

/* 上の帯（買い物メモと同じ細さ） */
.hd{background:linear-gradient(135deg,#55b834,#8bd44a);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 14px;border-radius:0 0 20px 20px;box-shadow:0 4px 0 rgba(47,125,30,.35)}
.hd-in{max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font:400 21px/1 "Dela Gothic One",sans-serif;text-shadow:0 2px 0 rgba(30,80,10,.35)}
.logo i{width:34px;height:34px;border-radius:10px;background:#fff;display:grid;place-items:center;font-style:normal;font-size:19px;text-shadow:none}
.tools{display:flex;gap:7px}
.ico{width:34px;height:34px;padding:0;border-radius:50%;background:rgba(255,255,255,.28);font-size:16px;display:grid;place-items:center;color:#fff;box-shadow:none}
.ico:active{background:rgba(255,255,255,.45);transform:none;box-shadow:none}
.ico.keyed{background:#fff;color:var(--gd)}
.hd .pg{margin-top:10px;height:6px;border-radius:99px;background:rgba(255,255,255,.4)}

main{max-width:520px;margin:0 auto;padding:12px 16px 0}
.seg{display:flex;gap:8px;margin:0 0 12px}
.seg button{flex:1;padding:11px;border-radius:14px;background:var(--card);color:var(--sub);border:2px solid var(--line);font-weight:800;box-shadow:0 3px 0 var(--line)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 3px 0 var(--gd)}
input.auto{border-color:var(--acc)!important;border-width:2px}
button,select,input{font:inherit}
button{border:0;border-radius:14px;padding:12px 16px;background:var(--acc);color:#fff;font-weight:800;box-shadow:0 4px 0 var(--gd)}
button:active{transform:translateY(2px);box-shadow:0 2px 0 var(--gd)}
input,select{width:100%;min-width:0;padding:12px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg)}
input:focus,select:focus{outline:0;border-color:var(--acc)}
.row{display:flex;gap:8px;margin-bottom:8px}
.row>*{flex:1}
.row>.narrow{flex:0 0 96px}
.card{background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.photo{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.photo label{flex:1;text-align:center;padding:12px;border:2px dashed #b9cfa0;border-radius:14px;color:var(--sub);font-weight:800}
.photo img{width:64px;height:64px;object-fit:cover;border-radius:12px}

/* ずんだもんの判定 */
#verdict{display:flex;gap:12px;align-items:center;border-radius:18px;padding:12px 14px;margin:4px 0 14px;background:var(--card);border:3px solid var(--line);box-shadow:0 4px 0 var(--line)}
#verdict .av{flex:none;width:64px;height:64px;border-radius:50%;background:#e2f5bd url(zun-normal.png) 0 0/105% auto no-repeat;border:3px solid #fff;box-shadow:0 3px 0 rgba(30,80,10,.22),0 0 0 3px #c4ec6f}
#verdict.good .av{background-image:url(zun-smile.png)}
#verdict.bad .av{background-image:url(zun-surprise.png)}
#verdict .tx{flex:1;min-width:0}
#verdict .big{font-size:18px;font-weight:800;line-height:1.3}
#verdict .sm{font-size:14px;color:var(--sub);margin-top:4px;white-space:pre-line;word-break:break-all;font-weight:500}
#verdict.good{border-color:var(--good)} #verdict.good .big{color:var(--good)}
#verdict.bad{border-color:var(--bad)} #verdict.bad .big{color:var(--bad)}
#verdict.warn{border-color:var(--warn)} #verdict.warn .big{color:var(--warn)}

.item h2{font-size:17px;margin:0 0 8px;font-weight:800}
.rank{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px solid #f0f6e4}
.rank img{width:44px;height:44px;object-fit:cover;border-radius:8px;flex:none}
.rank .ph{width:44px;height:44px;flex:none}
.rank .st{flex:1;min-width:0;font-weight:700}
.rank .st small{display:block;color:var(--sub);font-weight:500}
.rank .up{font-weight:800;text-align:right}
.rank.best .up{color:var(--good)}
.old{color:var(--warn)}
details{margin-top:8px;color:var(--sub);font-size:14px}
summary{cursor:pointer;font-weight:700}
.hist{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:2px solid #f0f6e4}
.hist span{flex:1}
.hist button{background:none;color:var(--sub);padding:2px 8px;box-shadow:none}
.empty{color:var(--sub);text-align:center;padding:32px 0;font-weight:700}
.credit{text-align:center;color:var(--sub);font-size:11px;margin:28px 0 8px}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:9}
#viewer img{max-width:100%;max-height:100%}

/* 下のタブ（買い物メモと同じ） */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabbar a{flex:1;height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--sub);font-size:11px;font-weight:800}
.tabbar a .i{font-size:22px;line-height:1}
.tabbar a.cur{color:var(--acc)}
.bk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin:22px 0 4px;font-size:12px;color:var(--sub);font-weight:700}
.bk button{padding:5px 12px;font-size:12px;border-radius:99px;background:var(--card);color:var(--gd);box-shadow:none;border:2px solid var(--line);font-weight:800}
</style>
</head>
<body>
<header class="hd">
  <div class="hd-in">
    <div class="top">
      <div class="logo"><i>🏷️</i>ずんだくらべ</div>
      <div class="tools"><button class="ico" id="tabSet" aria-label="設定">⚙</button></div>
    </div>
  </div>
</header>
<main>
<div class="seg">
  <button id="tabCheck" class="on">買う前に</button>
  <button id="tabList">一覧</button>
  <button id="tabRcpt">レシート</button>
</div>

<section id="secCheck">
  <div class="card">
    <div class="photo">
      <label>📷 値札を撮る<input id="file" type="file" accept="image/*" hidden></label>
      <img id="prev" alt="" hidden>
    </div>
    <input id="item" list="items" placeholder="商品（例: 鶏むね肉）" autocomplete="off" style="margin-bottom:8px">
    <datalist id="items"></datalist>
    <input id="store" list="stores" placeholder="お店" autocomplete="off" style="margin-bottom:8px">
    <datalist id="stores"></datalist>
    <div class="row">
      <input id="price" type="number" inputmode="decimal" min="0" placeholder="値段（円）">
      <select id="tax" class="narrow"><option value="in">税込</option><option value="ex">税抜</option></select>
    </div>
    <div class="row">
      <input id="qty" type="number" inputmode="decimal" min="0" placeholder="量">
      <select id="unit" class="narrow"><option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option><option value="L">L</option><option value="個">個・本</option></select>
    </div>
  </div>
  <div id="verdict"><div class="av"></div><div class="tx"><div class="big">—</div></div></div>
  <button id="save" style="width:100%">記録するのだ</button>
</section>

<section id="secList" hidden><div id="list"></div></section>

<section id="secRcpt" hidden>
  <div class="card">
    <div class="photo"><label>📷 レシートを撮る<input id="rfile" type="file" accept="image/*" hidden></label></div>
    <div id="rmsg" style="white-space:pre-line;font-size:13px;color:var(--sub);margin-top:8px"></div>
  </div>
  <div id="rout"></div>
</section>
<div class="bk"><span id="bkSt"></span><button id="bkSet" type="button">設定</button><button id="bkNow" type="button">今すぐ</button><button id="bkRestore" type="button">戻す</button></div>
<p class="credit">立ち絵：坂本アヒルさん</p>
</main>
<nav class="tabbar">
  <a href="https://ageargfbv.github.io/shopping-memo/"><span class="i">📝</span>買い物メモ</a>
  <a class="cur" href="https://ageargfbv.github.io/price-compare/"><span class="i">🏷️</span>最安くらべ</a>
</nav>
<div id="viewer"><img alt=""></div>

<script>
const TAX=1.08; // 食品の軽減税率
const KEY='price-compare-v1', DAY=86400000;
const UNIT={g:{per:100,disp:'100g',kind:'w'},ml:{per:100,disp:'100ml',kind:'v'},'個':{per:1,disp:'1個',kind:'c'}};
let recs=[];
try{recs=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(recs))}catch(e){alert('保存できませんでした')}bkSoon()};
const $=id=>document.getElementById(id);
const yen=n=>(Math.round(n*10)/10).toLocaleString('ja-JP');

// ---- 写真（IndexedDB） ----
let dbp;
function idb(){return dbp||(dbp=new Promise((ok,ng)=>{const r=indexedDB.open('price-compare',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)}))}
async function tx(mode,fn){const db=await idb();return new Promise((ok,ng)=>{const t=db.transaction('photos',mode);const rq=fn(t.objectStore('photos'));t.oncomplete=()=>ok(rq&&rq.result);t.onerror=()=>ng(t.error)})}
const putPhoto=(id,b)=>tx('readwrite',s=>s.put(b,id));
const getPhoto=id=>tx('readonly',s=>s.get(id));
const delPhoto=id=>tx('readwrite',s=>s.delete(id));
function shrink(file,max=1280){return new Promise((ok,ng)=>{
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):ng(new Error('blob')),'image/jpeg',.8)};
  im.onerror=()=>{URL.revokeObjectURL(u);ng(new Error('img'))};im.src=u})}

// ---- 単価計算 ----
function norm(price,tax,qty,unit){
  let q=+qty,u=unit;
  if(u==='kg'){q*=1000;u='g'}else if(u==='L'){q*=1000;u='ml'}
  const p=Math.round(tax==='ex'?price*TAX:price);
  return {price:p,qty:q,unit:u};
}
const unitPrice=r=>r.price/r.qty*UNIT[r.unit].per;
const sameItem=(a,b)=>a.trim().toLowerCase()===b.trim().toLowerCase();
function latestByStore(item,kind){
  const m=new Map();
  for(const r of recs){
    if(!sameItem(r.item,item)||UNIT[r.unit].kind!==kind)continue;
    const k=r.store.trim().toLowerCase(),o=m.get(k);
    if(!o||r.ts>o.ts)m.set(k,r);
  }
  return [...m.values()].sort((a,b)=>unitPrice(a)-unitPrice(b));
}
const ago=ts=>{const d=Math.floor((Date.now()-ts)/DAY);return d<=0?'今日':d+'日前'};

// ---- 判定 ----
function current(){
  const price=parseFloat($('price').value),qty=parseFloat($('qty').value);
  if(!(price>0)||!(qty>0))return null;
  return norm(price,$('tax').value,qty,$('unit').value);
}
function updateVerdict(){
  const v=$('verdict'),big=v.querySelector('.big');
  v.className='';v.querySelectorAll('.sm').forEach(e=>e.remove());
  const add=t=>{const d=document.createElement('div');d.className='sm';d.textContent=t;v.querySelector('.tx').append(d)};
  const item=$('item').value.trim(),c=current();
  if(!c){big.textContent='—';return}
  const up=unitPrice(c),disp=UNIT[c.unit].disp;
  big.textContent=yen(up)+'円 / '+disp;
  if(!item)return;
  const list=latestByStore(item,UNIT[c.unit].kind);
  if(!list.length){add('まだ比べる記録がないのだ');return}
  const best=list[0],bu=unitPrice(best),diff=up-bu,pct=diff/bu*100;
  const stale=Date.now()-best.ts>30*DAY?'（'+ago(best.ts)+'の価格）':'';
  if(diff<-0.05){
    v.className='good';big.textContent='最安なのだ！　'+yen(up)+'円 / '+disp;
    add('これまでの最安 '+best.store+' '+yen(bu)+'円 / '+disp+stale+' より '+yen(-diff)+'円安い');
  }else if(pct<=5){
    v.className='warn';big.textContent='ほぼ最安なのだ　'+yen(up)+'円 / '+disp;
    add('最安 '+best.store+' '+yen(bu)+'円 / '+disp+stale+'（差 '+yen(diff)+'円）');
  }else{
    v.className='bad';big.textContent='高いのだ…　'+yen(up)+'円 / '+disp;
    const pack=diff*c.qty/UNIT[c.unit].per;
    add(best.store+' の '+yen(bu)+'円 / '+disp+stale+' より '+yen(diff)+'円高い（+'+Math.round(pct)+'%）');
    add('このパックだと約 '+yen(pack)+'円 損なのだ');
  }
}

// ---- 一覧 ----
const urls=new Map();
async function thumb(id){
  if(!id)return null;
  if(urls.has(id))return urls.get(id);
  try{const b=await getPhoto(id);if(!b)return null;const u=URL.createObjectURL(b);urls.set(id,u);return u}catch(e){return null}
}
function openViewer(u){const v=$('viewer');v.querySelector('img').src=u;v.style.display='flex'}
$('viewer').onclick=()=>{$('viewer').style.display='none'};

async function renderList(){
  const box=$('list');box.textContent='';
  if(!recs.length){const e=document.createElement('div');e.className='empty';e.textContent='まだ記録がないのだ';box.append(e);return}
  const names=[...new Map(recs.map(r=>[r.item.trim().toLowerCase(),r.item.trim()])).values()].sort((a,b)=>a.localeCompare(b,'ja'));
  for(const name of names){
    const card=document.createElement('div');card.className='card item';
    const h=document.createElement('h2');h.textContent=name;card.append(h);
    for(const kind of ['w','v','c']){
      const list=latestByStore(name,kind);
      for(let i=0;i<list.length;i++){
        const r=list[i],row=document.createElement('div');row.className='rank'+(i===0?' best':'');
        const u=await thumb(r.photo);
        if(u){const im=document.createElement('img');im.src=u;im.alt='';im.onclick=()=>openViewer(u);row.append(im)}else{const p=document.createElement('div');p.className='ph';row.append(p)}
        const st=document.createElement('div');st.className='st';
        st.append(document.createTextNode((i===0?'★ ':'')+r.store));
        const sm=document.createElement('small');
        const old=Date.now()-r.ts>30*DAY;
        sm.textContent=yen(r.price)+'円 / '+yen(r.qty)+(r.unit==='個'?'個':r.unit)+' ・ '+ago(r.ts);
        if(old)sm.className='old';
        st.append(sm);
        const up=document.createElement('div');up.className='up';up.textContent=yen(unitPrice(r))+'円/'+UNIT[r.unit].disp;
        row.append(st,up);card.append(row);
      }
    }
    const det=document.createElement('details');const sum=document.createElement('summary');sum.textContent='履歴';det.append(sum);
    const all=recs.filter(r=>sameItem(r.item,name)).sort((a,b)=>b.ts-a.ts);
    for(const r of all){
      const h2=document.createElement('div');h2.className='hist';
      const s=document.createElement('span');s.textContent=new Date(r.ts).toLocaleDateString('ja-JP')+' '+r.store+' '+yen(r.price)+'円/'+yen(r.qty)+(r.unit==='個'?'個':r.unit);
      const d=document.createElement('button');d.textContent='✕';d.setAttribute('aria-label','削除');
      d.onclick=async()=>{
        if(!confirm('この記録を削除しますか？\n'+s.textContent))return;
        recs=recs.filter(x=>x.id!==r.id);persist();
        if(r.photo){urls.delete(r.photo);try{await delPhoto(r.photo)}catch(e){}}
        renderList();fillLists();updateVerdict();
      };
      h2.append(s,d);det.append(h2);
    }
    card.append(det);box.append(card);
  }
}

function fillLists(){
  const fill=(id,vals)=>{const dl=$(id);dl.textContent='';[...new Set(vals)].forEach(v=>{const o=document.createElement('option');o.value=v;dl.append(o)})};
  fill('items',recs.map(r=>r.item.trim()));
  fill('stores',recs.map(r=>r.store.trim()));
}

// ---- 入力 ----
// ---- 写真から読み取り（Gemini・無料枠。キーはこの端末にだけ置く） ----
const GKEY='price-compare-gemini-key';
const getKey=()=>{try{return localStorage.getItem(GKEY)||''}catch(e){return ''}};
const UNITS_OK=['g','kg','ml','L','個'];
const SCHEMA={type:'OBJECT',properties:{
  item:{type:'STRING',nullable:true},
  price:{type:'NUMBER',nullable:true},
  price_includes_tax:{type:'BOOLEAN',nullable:true},
  quantity:{type:'NUMBER',nullable:true},
  unit:{type:'STRING',nullable:true,enum:UNITS_OK},
  store:{type:'STRING',nullable:true}}};
function promptText(){
  const names=[...new Set(recs.map(r=>r.item.trim()))].slice(0,50);
  return '日本のスーパーの値札・パッケージの写真です。写っている商品を1つ読み取り、JSONで答えてください。\n'
  +'- item: 商品名。短く一般的な名前（例: 鶏むね肉、キャベツ、豚こま切れ）。産地・ブランド・グラム数は含めない。'
  +(names.length?'次の既存の商品名と同じ物なら、その表記をそのまま使う: '+names.join('、')+'\n':'\n')
  +'- price: この商品1パック（1個）の販売価格。数字のみ。「100gあたり」などの単価表示ではない方。税込と税抜が並ぶ場合は税込の値。\n'
  +'- price_includes_tax: price が税込ならtrue、税抜ならfalse、分からなければnull。\n'
  +'- quantity と unit: 内容量。g・kg・ml・L・個（本・枚・パックも「個」）。量り売りなどで分からなければnull。\n'
  +'- store: 店名が写っていればその名前。なければnull。\n'
  +'読み取れない項目は推測せずnullにする。';
}
const readTag=blob=>askGemini(blob,promptText(),SCHEMA);
async function askGemini(blob,prompt,schema){
  const key=getKey();if(!key)return null;
  const b64=await new Promise((ok,ng)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=ng;r.readAsDataURL(blob)});
  const body=JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:'image/jpeg',data:b64}}]}],
    generationConfig:{temperature:0,responseMimeType:'application/json',responseSchema:schema}});
  // 混んでいる・見つからない・上限のときは次のモデルへ。一巡してもだめなら2秒待って、もう一巡だけする
  const MODELS=['gemini-flash-latest','gemini-2.5-flash','gemini-2.5-flash-lite','gemini-flash-lite-latest'];
  const SKIP=[404,429,500,503];
  let last=null;
  for(let round=0;round<2;round++){
    if(round)await new Promise(ok=>setTimeout(ok,2000));
    for(const model of MODELS){
      let res;
      try{
        res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent',
          {method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body});
      }catch(err){last=err;continue}
      if(!res.ok){
        const e=new Error('http');e.status=res.status;
        try{const b=await res.json();e.detail=(b.error&&(b.error.status+': '+b.error.message))||''}catch(x){}
        if(SKIP.includes(res.status)){last=e;continue}
        throw e;
      }
      const j=await res.json();
      const c=(j.candidates||[])[0];
      const t=((c&&c.content&&c.content.parts)||[]).map(p=>p.text||'').join('');
      if(!t){const e=new Error('empty');e.detail='答えが空でした（'+((c&&c.finishReason)||(j.promptFeedback&&j.promptFeedback.blockReason)||'理由不明')+'）';throw e}
      try{return JSON.parse(t)}catch(x){const e=new Error('json');e.detail='答えを解釈できませんでした: '+t.slice(0,80);throw e}
    }
  }
  throw last||new Error('model');
}
function applyTag(r){
  const set=(id,v)=>{if(v===null||v===undefined||v==='')return;$(id).value=v;$(id).classList.add('auto')};
  set('item',typeof r.item==='string'?r.item.trim():null);
  set('price',r.price>0?r.price:null);
  if(typeof r.price_includes_tax==='boolean'){$('tax').value=r.price_includes_tax?'in':'ex'}
  set('qty',r.quantity>0?r.quantity:null);
  if(UNITS_OK.includes(r.unit))$('unit').value=r.unit;
  if(!$('store').value&&typeof r.store==='string')set('store',r.store.trim());
}
function showMsg(big,sm){
  const v=$('verdict');v.className='';v.querySelectorAll('.sm').forEach(e=>e.remove());
  v.querySelector('.big').textContent=big;
  if(sm){const d=document.createElement('div');d.className='sm';d.textContent=sm;v.querySelector('.tx').append(d)}
}
function errText(e){
  let m;
  if(e.status===429)m='無料枠の上限です。しばらくしてからもう一度';
  else if(e.status===401||e.status===403||(e.status===400&&/API key/i.test(e.detail||'')))m='APIキーを確認してください';
  else if(e.status===404)m='モデルが見つかりません';
  else if(e.status)m='Googleがエラーを返しました（'+e.status+'）';
  else if(e.detail)m='読み取りに失敗しました';
  else m='通信できませんでした';
  return e.detail?m+'\n'+e.detail.slice(0,160):m;
}

// ---- 近くの店を自動で入れる（位置は端末の中だけ。Geminiには送らない） ----
let pos=null,storeDirty=false;
function locate(){
  if(!navigator.geolocation)return Promise.resolve(null);
  return new Promise(ok=>navigator.geolocation.getCurrentPosition(
    p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,ts:Date.now()};ok(pos)},
    ()=>ok(null),{enableHighAccuracy:false,timeout:8000,maximumAge:60000}));
}
const rad=x=>x*Math.PI/180;
function dist(a,b){
  const s=Math.sin(rad(b.lat-a.lat)/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(rad(b.lng-a.lng)/2)**2;
  return 12742000*Math.asin(Math.sqrt(s));
}
function storeLocs(){
  // 同じ店名でも、記録した場所を全部覚える（別の店舗でも自動入力できる）。約10mごとに1つへまとめる
  const m=new Map();
  for(const r of recs){
    if(typeof r.lat!=='number'||typeof r.lng!=='number')continue;
    const s=r.store.trim(),k=s+'|'+r.lat.toFixed(4)+'|'+r.lng.toFixed(4);
    if(!m.has(k))m.set(k,{store:s,lat:r.lat,lng:r.lng});
  }
  return [...m.values()];
}
function nearestStore(p){
  let best=null;
  for(const s of storeLocs()){const d=dist(p,s);if(d<=150&&(!best||d<best.d))best={store:s.store,d}}
  return best;
}
async function autoStore(){
  const p=await locate();
  if(!p||p.acc>300||storeDirty)return;
  const n=nearestStore(p),el=$('store');
  if(n){el.value=n.store;el.classList.add('auto')}
  else{el.value='';el.classList.remove('auto')}
  updateVerdict();
}
$('store').addEventListener('input',()=>{storeDirty=true});

$('save').onclick=async()=>{
  const item=$('item').value.trim(),store=$('store').value.trim(),c=current();
  if(!item||!store||!c){alert('商品・お店・値段・量を入れてください');return}
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  let photo=null;
  if(pending){try{await putPhoto(id,pending);photo=id}catch(e){alert('写真は保存できませんでした（記録は保存します）')}}
  const here=pos&&Date.now()-pos.ts<600000?pos:await locate();
  const rec={id,item,store,price:c.price,qty:c.qty,unit:c.unit,photo,ts:Date.now()};
  if(here&&here.acc<=300){rec.lat=Math.round(here.lat*1e5)/1e5;rec.lng=Math.round(here.lng*1e5)/1e5}
  recs.push(rec);
  storeDirty=false;
  persist();
  try{localStorage.setItem(KEY+'-store',store)}catch(e){}
  ['item','price','qty'].forEach(k=>$(k).value='');
  document.querySelectorAll('input.auto').forEach(i=>i.classList.remove('auto'));
  pending=null;$('prev').hidden=true;$('prev').removeAttribute('src');
  fillLists();updateVerdict();
  const b=$('save');b.textContent='記録したのだ';setTimeout(()=>b.textContent='記録するのだ',1200);
};

// ---- レシート読み取り（試験：読み取った結果を見るだけ。記録には入れない） ----
const RSCHEMA={type:'OBJECT',properties:{
  store:{type:'STRING',nullable:true},
  date:{type:'STRING',nullable:true},
  total:{type:'NUMBER',nullable:true},
  items:{type:'ARRAY',items:{type:'OBJECT',properties:{
    raw:{type:'STRING'},name:{type:'STRING'},price:{type:'NUMBER'},
    quantity:{type:'NUMBER',nullable:true},unit:{type:'STRING',nullable:true,enum:UNITS_OK},
    kind:{type:'STRING',enum:['品目','値引き','小計・税・合計・支払い','その他']}}}}}};
const RPROMPT='日本のスーパーのレシートの写真です。全行を読み取り、JSONで答えてください。\n'
  +'- store: 店名。date: 日付（YYYY-MM-DD）。total: 合計金額（税込）。\n'
  +'- items: 品目の行ごとに1要素。raw は印字そのまま（半角カナ含む）、name は一般的な商品名に直したもの（例: ﾎｳﾚﾝｿｳ→ほうれん草）。\n'
  +'- price: その行の金額（数字のみ）。値引き行はマイナスで kind を「値引き」。\n'
  +'- quantity と unit: 行に個数やグラム数が印字されていればその値。なければnull。\n'
  +'- kind: 品目／値引き／小計・税・合計・支払い／その他 のどれか。\n'
  +'読み取れない項目は推測せずnullにする。';
$('rfile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const out=$('rout');out.textContent='';
  if(!getKey()){$('rmsg').textContent='右上の⚙でAPIキーを入れてください';return}
  $('rmsg').textContent='読み取り中…';
  try{
    const r=await askGemini(await shrink(f,2000),RPROMPT,RSCHEMA);
    const items=(r.items||[]),buy=items.filter(i=>i.kind==='品目');

    $('rmsg').textContent=(r.store||'店名なし')+' ・ '+(r.date||'日付なし')+' ・ 合計 '+(r.total!=null?yen(r.total)+'円':'—')
      +'\n品目 '+buy.length+'行 ／ 品目と値引きの合計 '+yen(sum)+'円'+(r.total!=null&&Math.abs(sum-r.total)>1?'（合計と '+yen(sum-r.total)+'円ずれ）':'（合計と一致）');
    const card=document.createElement('div');card.className='card';

      const p=document.createElement('b');p.textContent=yen(i.price);
      row.append(s,p);card.append(row);
    }
    out.append(card);
  }catch(err){$('rmsg').textContent='読み取れませんでした\n'+errText(err)}
};

function bkCollect(){return {recs}}
function bkEmpty(){return !recs.length}
// 足りない記録だけ加える（今の記録は消さない）。写真は含まれない
function bkApply(d){
  let n=0;
  for(const x of (d.recs||[])){if(x&&x.id&&!recs.some(y=>y.id===x.id)){recs.push(x);n++}}
  persist();fillLists();updateVerdict();
  if(!$('secList').hidden)renderList();
  return n+'件';
}

// ---- バックアップ（GitHub の非公開リポジトリ backup-data）----
// トークン（Fine-grained・このリポジトリの Contents だけ）は端末にだけ置く。2つのアプリで共有。写真は含めない
const BK={owner:'ageargfbv',repo:'backup-data',tokKey:'backup-gh-token',file:'price-compare.json',lastKey:'backup-last-price-compare'};
const bkTok=()=>{try{return localStorage.getItem(BK.tokKey)||''}catch(e){return ''}};
const bkGet=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};
const bkSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const b64=s=>{const b=new TextEncoder().encode(s);let x='';for(let i=0;i<b.length;i+=0x8000)x+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(x)};
const unb64=s=>{const x=atob(s.replace(/\s/g,'')),b=new Uint8Array(x.length);for(let i=0;i<x.length;i++)b[i]=x.charCodeAt(i);return new TextDecoder().decode(b)};
const bkHash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)+':'+s.length};
const bkApi=(method,path,body)=>fetch('https://api.github.com/repos/'+BK.owner+'/'+BK.repo+path,{method,
  headers:{'Authorization':'Bearer '+bkTok(),'Accept':'application/vnd.github+json','Content-Type':'application/json'},
  body:body?JSON.stringify(body):undefined});
const bkErr=e=>{const s=e&&e.status;return s===401||s===403?'トークンを確認してください（'+s+'）':s===404?'トークンの対象に backup-data が入っていません（404）':s?'保存できませんでした（'+s+'）':'通信できませんでした'};
async function bkRemote(){
  const r=await bkApi('GET','/contents/'+BK.file+'?t='+Date.now());
  if(r.status===404)return null;
  if(!r.ok){const e=new Error('http');e.status=r.status;throw e}
  const j=await r.json();
  return {sha:j.sha,payload:JSON.parse(unb64(j.content))};
}
function bkStatus(msg){
  const el=document.getElementById('bkSt');if(!el)return;
  if(msg){el.textContent='☁ '+msg;return}
  const at=+bkGet(BK.lastKey+'-at');
  el.textContent=!bkTok()?'☁ バックアップ：未設定':at?'☁ 最後の保存 '+new Date(at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'☁ つながっています（まだ保存していません）';
}
let bkBusy=false,bkTimer=0,bkDirty=false;
// データが変わったら、少し待ってから自動で送る（続けて変えたときは最後の1回だけ）
function bkSoon(){try{if(!bkTok())return;bkDirty=true;clearTimeout(bkTimer);bkTimer=setTimeout(()=>bkPush(),8000)}catch(e){}}   // 起動直前（下の定義より前）に呼ばれても落ちない
async function bkPush(force){
  if(!bkTok()||bkBusy)return;
  clearTimeout(bkTimer);bkDirty=false;
  const data=bkCollect(),body=JSON.stringify(data),hash=bkHash(body);
  if(!force&&bkGet(BK.lastKey)===hash)return;
  bkBusy=true;bkStatus('保存中…');
  try{
    const rem=await bkRemote();
    const put=sha=>bkApi('PUT','/contents/'+BK.file,{message:'バックアップ '+new Date().toLocaleString('ja-JP'),
      content:b64(JSON.stringify({app:'price-compare',savedAt:Date.now(),data})),...(sha?{sha}:{})});
    let r=await put(rem&&rem.sha);
    if(r.status===409||r.status===422){const rem2=await bkRemote();r=await put(rem2&&rem2.sha)}
    if(!r.ok){const e=new Error('http');e.status=r.status;throw e}
    bkSet(BK.lastKey,hash);bkSet(BK.lastKey+'-at',String(Date.now()));bkStatus();
  }catch(e){bkStatus(bkErr(e));bkDirty=true}
  finally{bkBusy=false}
}
async function bkRestore(auto){
  if(!bkTok()){bkStatus('先に「設定」でトークンを入れてください');return}
  try{
    const rem=await bkRemote();
    if(!rem){bkStatus('保存がまだありません');return}
    const when=new Date(rem.payload.savedAt).toLocaleString('ja-JP');
    if(!confirm('GitHubの保存（'+when+'）を取り込みますか？\n今の内容は消えず、足りない分が加わります。')){if(auto)bkSet('backup-declined-price-compare',String(Date.now()));return}
    const n=bkApply(rem.payload.data||{});
    bkSet(BK.lastKey,'');bkStatus('取り込みました（'+n+'）');
  }catch(e){bkStatus(bkErr(e))}
}
async function bkSetup(){
  const SET='（設定済み）';
  const v=prompt('GitHubのトークン（空にすると削除）',bkTok()?SET:'');
  if(v===null)return;
  const t=v.trim();if(t===SET)return;
  if(!t){try{localStorage.removeItem(BK.tokKey)}catch(e){}bkStatus();return}
  bkSet(BK.tokKey,t);bkStatus('確認中…');
  try{
    const r=await bkApi('GET','');
    if(!r.ok){const e=new Error('http');e.status=r.status;throw e}
    bkStatus('つながりました');
    if(bkEmpty())await bkRestore(false);else await bkPush(true);
  }catch(e){bkStatus(bkErr(e))}
}
document.getElementById('bkSet').onclick=bkSetup;
document.getElementById('bkNow').onclick=()=>bkPush(true);
document.getElementById('bkRestore').onclick=()=>bkRestore(false);
// アプリを離れるとき、送っていない変更があれば送る
document.addEventListener('visibilitychange',()=>{if(document.hidden&&bkDirty)bkPush()});
bkStatus();
// データが空なのに保存がある（消えたあと）ときは、取り込みを勧める。断ったら1日は聞かない
if(bkTok()&&bkEmpty()&&Date.now()-(+bkGet('backup-declined-price-compare')||0)>864e5)bkRestore(true);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
